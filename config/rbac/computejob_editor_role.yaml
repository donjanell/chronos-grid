# This rule is not used by the project chronos-grid itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the batch.chronos.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: chronos-grid
    app.kubernetes.io/managed-by: kustomize
  name: computejob-editor-role
rules:
- apiGroups:
  - batch.chronos.io
  resources:
  - computejobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch.chronos.io
  resources:
  - computejobs/status
  verbs:
  - get
